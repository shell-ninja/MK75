  <rect x="76" y="238" width="44" height="28" rx="6" fill="#22293A" stroke="#303A4F"/>
  <rect x="126" y="238" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="160" y="238" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="194" y="238" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="228" y="238" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
