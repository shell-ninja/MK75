  <rect x="246" y="166" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="280" y="166" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="314" y="166" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="348" y="166" width="46" height="28" rx="6" fill="#22293A" stroke="#303A4F"/>
