  <rect x="296" y="238" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="330" y="238" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="364" y="238" width="30" height="28" rx="6" fill="url(#accentGrad)"/>
  <rect x="404" y="238" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>

  <!-- Row 5: Shift Row -->
  <rect x="76" y="274" width="56" height="28" rx="6" fill="#22293A" stroke="#303A4F"/>
  <rect x="138" y="274" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="172" y="274" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="206" y="274" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="240" y="274" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="274" y="274" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="308" y="274" width="48" height="28" rx="6" fill="#22293A" stroke="#303A4F"/>
  <rect x="364" y="274" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="404" y="274" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>

