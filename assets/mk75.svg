  <rect x="324" y="202" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="358" y="202" width="36" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="404" y="202" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>

