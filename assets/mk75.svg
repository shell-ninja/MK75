<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11141F"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D2230"/>
      <stop offset="100%" stop-color="#141722"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="knobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E364A"/>
      <stop offset="100%" stop-color="#181D29"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#262D3D" stroke-width="4"/>

  <!-- Subtle glow beneath chassis -->
  <rect x="54" y="110" width="404" height="290" rx="24" fill="#6366F1" opacity="0.15" filter="url(#glow)"/>

  <!-- Keyboard Chassis -->
  <rect x="54" y="110" width="404" height="290" rx="24" fill="url(#chassisGrad)" stroke="#333C52" stroke-width="3"/>
  <rect x="64" y="120" width="384" height="270" rx="16" fill="#10131B" stroke="#1B202D" stroke-width="2"/>

  <!-- Row 1: Function Row & Knob -->
  <rect x="76" y="132" width="32" height="26" rx="6" fill="url(#accentGrad)"/>
  <rect x="116" y="132" width="28" height="26" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="150" y="132" width="28" height="26" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="184" y="132" width="28" height="26" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="218" y="132" width="28" height="26" rx="6" fill="#1A202D" stroke="#252C3D"/>
