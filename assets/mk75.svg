  <rect x="366" y="310" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="400" y="310" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>

  <!-- Subtle 'MK75' branding text at bottom -->
  <text x="256" y="450" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="24" font-weight="700" letter-spacing="3">MK75</text>
</svg>