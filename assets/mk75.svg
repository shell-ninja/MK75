  <rect x="326" y="132" width="28" height="26" rx="6" fill="#1A202D" stroke="#252C3D"/>
  <rect x="360" y="132" width="28" height="26" rx="6" fill="#1A202D" stroke="#252C3D"/>

  <!-- Top-Right Rotary Knob -->
  <circle cx="418" cy="146" r="20" fill="url(#knobGrad)" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="418" cy="146" r="12" fill="#141924" stroke="#252E42" stroke-width="1.5"/>
  <line x1="418" y1="127" x2="418" y2="134" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Row 2: Number Row -->
  <rect x="76" y="166" width="28" height="28" rx="6" fill="#1A202D" stroke="#252C3D"/>
